<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CytogeneticsPro — pruebas</title>
<link rel="stylesheet" href="../css/labg-base.css">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
<style>
  body { padding: 20px; }
  .t { font-family: var(--mono); font-size: .8rem; padding: 2px 0; overflow-wrap: anywhere; }
  .ok { color: var(--success-text); } .bad { color: var(--danger-text); font-weight: 700; }
  h2 { margin: 18px 0 4px; font-size: 1rem; }
  *, *::before, *::after { transition: none !important; }
</style>
</head>
<body>
<h1>CytogeneticsPro · <span id="sum">…</span></h1>
<p class="hint">Pruebas automáticas de los motores. Abre esta página con doble clic; cada línea debe salir en verde.</p>
<div id="out"></div>
<script src="../js/core.js"></script>
<script src="../js/stats.js"></script>
<script src="../js/karyotype.js"></script>
<script src="../js/asymmetry.js"></script>
<script src="../js/meiosis.js"></script>
<script src="../js/ploidy.js"></script>
<script src="../js/bands.js"></script>
<script src="../js/compare.js"></script>
<script src="../js/idiogram.js"></script>
<script src="../js/image.js"></script>
<script src="../js/figure.js"></script>
<script src="../js/grid.js"></script>
<script src="../js/charts.js"></script>
<script src="../js/examples.js"></script>
<script src="../js/block2.js"></script>
<script src="../js/block3.js"></script>
<script src="../js/block4.js"></script>
<script src="../js/block6.js"></script>
<script src="../js/block8.js"></script>
<script src="../js/art.js"></script>
<script src="../js/home.js"></script>
<script src="../js/teach.js"></script>
<script src="../js/zip.js"></script>
<script src="../js/report.js"></script>
<script>
/* The harness: every line must be green. */
let pass = 0, fail = 0;
const out = document.getElementById('out');
function sec(title) { out.appendChild(mk('h2', null, esc(title))); }
function t(name, cond, info) {
  const okv = !!cond;
  okv ? pass++ : fail++;
  out.appendChild(mk('div', { class: 't ' + (okv ? 'ok' : 'bad') },
    (okv ? '✔ ' : '✘ ') + esc(name) + (info != null && !okv ? '  →  ' + esc(info) : '')));
}
function near(name, a, b, tol) {
  tol = tol == null ? 1e-9 : tol;
  const d = Math.abs(a - b);
  t(name + '  (' + (typeof a === 'number' ? +a.toPrecision(12) : a) + ' vs ' + b + ')', d <= tol || (Number.isNaN(a) && Number.isNaN(b)), 'diff ' + d);
}
const pending = [];
function later(p) { pending.push(p.catch(e => t('una prueba asíncrona no lanzó errores', false, e.message || String(e)))); }
</script>
<script src="t_stats.js"></script>
<script src="t_karyo.js"></script>
<script src="t_asym.js"></script>
<script src="t_meiosis.js"></script>
<script src="t_image.js"></script>
<script src="t_ploidy.js"></script>
<script src="t_bands.js"></script>
<script src="t_compare.js"></script>
<script src="t_teach.js"></script>
<script src="t_report.js"></script>
<script>
function summary() {
  document.getElementById('sum').innerHTML = fail === 0
    ? `<span class="ok">${pass} pruebas, todas pasan</span>`
    : `<span class="bad">${fail} fallan</span> de ${pass + fail}`;
  document.title = 'CytogeneticsPro — ' + (fail ? fail + ' fallan' : pass + ' pruebas');
}
summary();
window.testsDone = Promise.all(pending).then(() => { summary(); return { pass, fail }; });
</script>
</body>
</html>
